<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />

    <!-- Shavro branding -->
    <title>Shavro — Your Money, Made Simple</title>

    <meta
      name="description"
      content="Shavro is a simple, private expense and income tracker. Your Money, Made Simple."
    />

    <meta name="application-name" content="Shavro" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Progressive Web App -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Browser and iPhone icons -->
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shavro" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Expo / React Native Web reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run Shavro. </noscript>

    <div id="root"></div>
  </body>
</html>
